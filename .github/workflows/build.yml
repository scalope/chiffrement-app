name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip python3-venv git zip unzip \
          openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev \
          build-essential ccache libltdl-dev \
          libgdbm-dev libbz2-dev libreadline-dev \
          libsqlite3-dev

    - name: Install Buildozer and dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install buildozer==1.5.0
        pip install cython==0.29.37

    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: buildozer-${{ hashFiles('buildozer.spec') }}-v2
        restore-keys: |
          buildozer-

    - name: Build APK
      run: |
        yes | buildozer android debug 2>&1
      timeout-minutes: 60

    - name: Find APK
      run: |
        echo "=== Contenu du dossier bin ==="
        ls -la bin/ || echo "Dossier bin introuvable"
        echo "=== Recherche APK partout ==="
        find . -name "*.apk" 2>/dev/null || echo "Aucun APK trouve"
        echo "=== Logs buildozer ==="
        tail -50 .buildozer/logs/last_build.log 2>/dev/null || echo "Pas de log"

    - name: Upload APK
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ChiffrementApp-debug
        path: |
          bin/*.apk
          .buildozer/logs/
        retention-days: 30
        if-no-files-found: warn
