name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip python3-venv git zip unzip \
          openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev \
          build-essential ccache libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==3.0.11

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log || true

    - name: Trouver APK
      if: always()
      run: |
        echo "=== Chercher APK partout ==="
        find . -name "*.apk" 2>/dev/null
        echo "=== Contenu bin/ ==="
        ls -la bin/ 2>/dev/null || echo "Pas de dossier bin/"
        echo "=== 30 dernieres lignes ==="
        tail -30 build.log 2>/dev/null || true
        echo "=== Erreurs ==="
        grep -i "error\|exception\|failed" build.log 2>/dev/null | grep -v DEBUG | tail -20 || true

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: |
          bin/*.apk
          **/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
