name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip python3-venv git zip unzip \
          openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev \
          build-essential ccache libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==3.0.11

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-

    - name: Build APK and capture error
      run: |
        buildozer android debug 2>&1 | tee build.log || true
        echo "=== DERNIÈRES LIGNES ==="
        tail -50 build.log
        echo "=== LIGNES ERREUR ==="
        grep -i "error\|exception\|failed\|traceback" build.log | tail -30 || true
        # Vérifier si APK créé
        ls bin/*.apk 2>/dev/null && echo "APK CRÉÉ OK" || echo "APK NON CRÉÉ"

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ChiffrementApp-debug
        path: bin/*.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload log complet
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
